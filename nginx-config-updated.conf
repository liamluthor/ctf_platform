# HTTP configuration (redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name ctf.strayerraptors.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ctf.strayerraptors.com;

    # SSL Certificate paths
    ssl_certificate /etc/letsencrypt/live/ctf.strayerraptors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctf.strayerraptors.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size (for challenge files)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Logging
    access_log /var/log/nginx/ctfd_access.log;
    error_log /var/log/nginx/ctfd_error.log;

    # Proxy everything to CTFd
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_redirect off;

        # Disable buffering for file uploads
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (increased for file uploads)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Important: Increase body size limits for proxy
        client_max_body_size 100M;
        client_body_buffer_size 128k;
    }
}
